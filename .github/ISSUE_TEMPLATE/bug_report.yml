name: Bug report
description: Something in the app does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! The app can fill this form for you: **Feedback › Report a problem**.
        It also creates a `.zip` with the app log (passwords, IPs and SteamIDs masked) and your optional screenshot.
        Drag that file into the box below.
  - type: textarea
    id: description
    attributes:
      label: What happened? (optional)
      description: What you did, what you expected and what happened instead.
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: '0.2.0'
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: 'Windows 11 (build 26100)'
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Report file and screenshots (optional)
      description: Drag the `.zip` created by the app, or images, into this box.
    validations:
      required: false
